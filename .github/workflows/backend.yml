name: Backend CI

on:
  workflow_dispatch:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"
          allow-prereleases: true
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  # Every backend change on main goes to Fly, then a smoke test hits the real API.
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    environment:
      name: production
      url: https://api-shivamer.bytestay.pt/healthz
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check deploy token
        id: token
        env:
          HAS_FLY_TOKEN: ${{ secrets.FLY_API_TOKEN != '' }}
        run: |
          if [ "$HAS_FLY_TOKEN" != "true" ]; then
            echo "::warning::FLY_API_TOKEN secret not set, skipping deploy (deploy manually with flyctl)."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        if: steps.token.outputs.present == 'true'
        with:
          version: "0.5.14"
      - name: Deploy to Fly
        if: steps.token.outputs.present == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        # A new APT_REFRESH busts the apt-get upgrade layer, so each deploy ships that day's Debian fixes.
        run: flyctl deploy --remote-only --app bst-shivamer-backend --build-arg APT_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
      - name: Smoke test
        if: steps.token.outputs.present == 'true'
        run: |
          out=$(curl -sf --retry 5 --retry-all-errors --max-time 30 -X POST \
            https://api-shivamer.bytestay.pt/convert \
            -H 'Content-Type: application/json' \
            -d '{"code": "for i in range(3):\n    print(i)"}')
          echo "$out"
          echo "$out" | grep -q 'for i in range(3)'
