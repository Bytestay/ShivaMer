# Dependabot: monthly version updates, one grouped PR per ecosystem and directory.
# Security updates are grouped too. Every dependency PR is validated before merge.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      all:
        applies-to: "version-updates"
        patterns: ["*"]
      security:
        applies-to: "security-updates"
        patterns: ["*"]
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      all:
        applies-to: "version-updates"
        patterns: ["*"]
      security:
        applies-to: "security-updates"
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    # Majors (React 19, Vite 8, Tailwind 4, plugin-react 6) are a planned migration, not a monthly bump.
    # monaco-editor stays on the range react-monaco-editor supports (peer ^0.52): its 0.x minors break the build.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "monaco-editor"
        update-types: ["version-update:semver-minor"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      all:
        applies-to: "version-updates"
        patterns: ["*"]
      security:
        applies-to: "security-updates"
        patterns: ["*"]
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      all:
        applies-to: "version-updates"
        patterns: ["*"]
      security:
        applies-to: "security-updates"
        patterns: ["*"]
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      all:
        applies-to: "version-updates"
        patterns: ["*"]
      security:
        applies-to: "security-updates"
        patterns: ["*"]
